<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>AesthetiCalc</title>
		<link rel="stylesheet" href="style.css" type="text/css">
		<link rel="icon" href="icon512.png" type="image/png">
		<link rel="manifest" href="manifest.json" />
	</head>
	<body>
		<div id="main-container">
			<div id="title">AesthetiCalc &#x1F496;</div>
			<div id="calculator-answer">0</div>
			<table id="calculator">
				</tr>
					<td onClick="calcBtn('DEL')">clr</td>
					<td onClick="calcBtn('INT')">int</td>
					<td onClick="calcBtn('PI')">pi</td>
					<td onClick="calcBtn('/')">/</td>
				</tr>
				<tr>
					<td onClick="calcBtn('7')">7</td>
					<td onClick="calcBtn('8')">8</td>
					<td onClick="calcBtn('9')">9</td>
					<td onClick="calcBtn('*')">&times;</td>
				</tr>
				<tr>
					<td onClick="calcBtn('4')">4</td>
					<td onClick="calcBtn('5')">5</td>
					<td onClick="calcBtn('6')">6</td>
					<td onClick="calcBtn('-')">-</td>
				</tr>
				<tr>
					<td onClick="calcBtn('1')">1</td>
					<td onClick="calcBtn('2')">2</td>
					<td onClick="calcBtn('3')">3</td>
					<td onClick="calcBtn('+')">+</td>
				</tr>
					<td onClick="calcBtn('.')">.</td>
					<td onClick="calcBtn('0')">0</td>
					<td colspan="2" onClick="calcBtn('EQU')">&equals;</td>
					
				</tr>
			</table>
		</div>
	<script src="main.js"></script>
	</body>
</html>
